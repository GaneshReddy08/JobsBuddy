name: Update job board

on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write

# Serialize runs: overlapping scheduled + manual dispatches used to race on
# `git push` and fail with "non-fast-forward (fetch first)". Queued runs wait
# for the in-progress one instead of colliding with it.
concurrency:
  group: update-job-board
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the scraper
        run: python src/main.py

      - name: Commit updated board
        run: |
          git config user.name  "job-board-bot"
          git config user.email "bot@users.noreply.github.com"
          git add README.md index.html sitemap.xml feed.xml robots.txt data/jobs.json c/
          git commit -m "Auto-update job board" || echo "No changes"
          git push
